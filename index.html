<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>My Cloud Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:
  linear-gradient(
    135deg,
    #0f172a,
    #111827,
    #1e293b
  );

  min-height:100vh;

  color:white;

  padding:20px;
}

.container{
  max-width:1400px;
  margin:auto;
}

.top{

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;

  flex-wrap:wrap;

  margin-bottom:25px;
}

.logo{

  font-size:34px;
  font-weight:bold;
}

.logo span{
  color:#3b82f6;
}

.album-create{

  display:flex;
  gap:10px;

  flex-wrap:wrap;
}

input{

  padding:14px;

  border:none;

  border-radius:14px;

  background:#1e293b;

  color:white;

  min-width:220px;

  outline:none;

  font-size:16px;
}

button{

  border:none;

  border-radius:14px;

  padding:14px 18px;

  cursor:pointer;

  color:white;

  font-weight:bold;

  transition:0.2s;
}

.primary{

  background:#2563eb;
}

.primary:hover{

  background:#1d4ed8;

  transform:translateY(-2px);
}

.albums{

  display:flex;

  gap:12px;

  flex-wrap:wrap;

  margin-bottom:25px;
}

.album{

  background:#1e293b;

  padding:12px 18px;

  border-radius:14px;

  cursor:pointer;

  transition:0.2s;

  border:2px solid transparent;
}

.album:hover{

  transform:scale(1.04);
}

.album.active{

  border-color:#3b82f6;

  background:#172554;
}

.upload-box{

  background:rgba(255,255,255,0.05);

  border:2px dashed rgba(255,255,255,0.2);

  padding:25px;

  border-radius:20px;

  margin-bottom:30px;

  backdrop-filter:blur(10px);
}

.gallery{

  display:grid;

  grid-template-columns:
  repeat(auto-fill,minmax(230px,1fr));

  gap:20px;
}

.card{

  background:rgba(255,255,255,0.05);

  border-radius:20px;

  overflow:hidden;

  backdrop-filter:blur(10px);

  transition:0.25s;

  border:1px solid rgba(255,255,255,0.1);
}

.card:hover{

  transform:translateY(-5px);

  box-shadow:
  0 10px 30px rgba(0,0,0,0.3);
}

.card img{

  width:100%;

  height:220px;

  object-fit:cover;
}

.card-body{

  padding:15px;
}

.card-buttons{

  display:flex;

  gap:10px;

  margin-top:10px;
}

.download{

  background:#10b981;
  flex:1;
}

.delete{

  background:#ef4444;
  flex:1;
}

.download:hover{

  background:#059669;
}

.delete:hover{

  background:#dc2626;
}

.empty{

  text-align:center;

  margin-top:60px;

  opacity:0.6;

  font-size:20px;
}

.footer{

  text-align:center;

  margin-top:40px;

  opacity:0.6;
}

@media(max-width:700px){

  .top{

    flex-direction:column;

    align-items:flex-start;
  }

  .album-create{

    width:100%;
  }

  input{

    width:100%;
  }

  button{

    width:100%;
  }

}

</style>
</head>
<body>

<div class="container">

<div class="top">

  <div class="logo">
    ☁ <span>My Cloud Gallery</span>
  </div>

  <div class="album-create">

    <input
      type="text"
      id="albumInput"
      placeholder="Create new album"
    >

    <button
      class="primary"
      onclick="addAlbum()"
    >
      ➕ Add Album
    </button>

  </div>

</div>

<div class="albums" id="albums"></div>

<div class="upload-box">

  <input
    type="file"
    id="fileInput"
    multiple
    accept="image/*"
  >

  <button
    class="primary"
    onclick="uploadPhotos()"
  >
    ⬆ Upload Photos
  </button>

</div>

<div class="gallery" id="gallery"></div>

<div class="empty" id="empty">
  📂 No Photos Found
</div>

<div class="footer">
  Made with ❤️ using Supabase
</div>

</div>

<script>

// =========================
// SUPABASE
// =========================

const supabaseUrl =
"https://mqhckgezaxswrroqwnvt.supabase.co";

const supabaseKey =
"PASTE_YOUR_REAL_ANON_KEY";

const supabase =
window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

// =========================
// ALBUMS
// =========================

let albums =
JSON.parse(
  localStorage.getItem("albums")
) || ["Default"];

let currentAlbum = albums[0];

renderAlbums();

function addAlbum(){

  const input =
  document.getElementById("albumInput");

  const name =
  input.value.trim();

  if(!name){

    alert("Enter album name");

    return;
  }

  if(albums.includes(name)){

    alert("Album already exists");

    return;
  }

  albums.push(name);

  localStorage.setItem(
    "albums",
    JSON.stringify(albums)
  );

  currentAlbum = name;

  input.value = "";

  renderAlbums();

  loadPhotos();
}

function renderAlbums(){

  const albumsDiv =
  document.getElementById("albums");

  albumsDiv.innerHTML = "";

  albums.forEach(album=>{

    const div =
    document.createElement("div");

    div.className =
    currentAlbum === album
    ? "album active"
    : "album";

    div.innerText = "📁 " + album;

    div.onclick = ()=>{

      currentAlbum = album;

      renderAlbums();

      loadPhotos();
    };

    albumsDiv.appendChild(div);
  });
}

// =========================
// UPLOAD
// =========================

async function uploadPhotos(){

  const files =
  document.getElementById("fileInput").files;

  if(!files.length){

    alert("Select photos");

    return;
  }

  for(const file of files){

    const fileName =
    `${currentAlbum}/${Date.now()}-${file.name}`;

    const { error } =
    await supabase.storage
    .from("photos")
    .upload(fileName, file);

    if(error){

      console.log(error);

      alert(error.message);

      return;
    }
  }

  alert("Upload Complete ✅");

  document.getElementById(
    "fileInput"
  ).value = "";

  loadPhotos();
}

// =========================
// LOAD PHOTOS
// =========================

async function loadPhotos(){

  const gallery =
  document.getElementById("gallery");

  const empty =
  document.getElementById("empty");

  gallery.innerHTML = "";

  const { data, error } =
  await supabase.storage
  .from("photos")
  .list(currentAlbum);

  if(error){

    console.log(error);

    return;
  }

  if(!data.length){

    empty.style.display = "block";

    return;
  }

  empty.style.display = "none";

  data.forEach(photo=>{

    const imageUrl =
    `${supabaseUrl}/storage/v1/object/public/photos/${currentAlbum}/${photo.name}`;

    const card =
    document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <img src="${imageUrl}">

      <div class="card-body">

        <div>
          📸 ${photo.name.substring(0,20)}
        </div>

        <div class="card-buttons">

          <a
            href="${imageUrl}"
            download
            style="flex:1;"
          >

            <button class="download">
              ⬇ Download
            </button>

          </a>

          <button
            class="delete"
            onclick="deletePhoto('${photo.name}')"
          >
            🗑 Delete
          </button>

        </div>

      </div>
    `;

    gallery.appendChild(card);
  });
}

// =========================
// DELETE
// =========================

async function deletePhoto(name){

  const ok =
  confirm("Delete photo ?");

  if(!ok) return;

  const { error } =
  await supabase.storage
  .from("photos")
  .remove([
    `${currentAlbum}/${name}`
  ]);

  if(error){

    alert("Delete failed");

    return;
  }

  loadPhotos();
}

loadPhotos();

</script>

</body>
</html>
