<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MY GALLERY</title>

<script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0/dist/umd/appwrite.min.js"></script>

<style>
body{
margin:0;
background:#0a001f;
color:white;
font-family:Arial;
}

/* PASSWORD */
#passwordScreen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
gap:15px;
background:#0a001f;
z-index:9999;
}

input,button{
padding:12px;
border-radius:10px;
}

button{
background:#22d3ee;
border:none;
cursor:pointer;
font-weight:bold;
}

/* GALLERY */
.gallery{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.nft-card{
aspect-ratio:1/1;
overflow:hidden;
border-radius:10px;
background:#111;
}

.nft-card img,.nft-card video{
width:100%;
height:100%;
object-fit:cover;
}

/* MODAL */
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

.modal-content{
width:90%;
max-width:600px;
background:#1a0033;
padding:10px;
border-radius:12px;
}

#modalImage,#modalVideo{
width:100%;
display:none;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordScreen">
<h2>Enter Password</h2>
<input id="passwordInput" type="password"/>
<button onclick="checkPassword()">ENTER</button>
<p id="passwordError" style="color:red;display:none;">Wrong Password</p>
</div>

<!-- MAIN -->
<div id="mainContent" style="display:none;">

<h2 style="text-align:center;">MY GALLERY</h2>

<div class="gallery" id="gallery"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<img id="modalImage"/>
<video id="modalVideo" controls></video>

</div>
</div>

<script>

/* APPWRITE INIT */
const client = new Appwrite.Client()
.setEndpoint("https://cloud.appwrite.io/v1")
.setProject("6a114ad10016ccbf7c88");

const databases = new Appwrite.Databases(client);
const storage = new Appwrite.Storage(client);

const DATABASE_ID = "6a114c7a0009c6453772";
const COLLECTION_ID = "photos_data";

const PASSWORD = "1234";

let currentSection = "sec1";

/* PASSWORD FIXED */
function checkPassword(){

const val = document.getElementById("passwordInput").value;

if(val === PASSWORD){

document.getElementById("passwordScreen").style.display="none";
document.getElementById("mainContent").style.display="block";

loadPhotos();

}else{
document.getElementById("passwordError").style.display="block";
}
}

/* LOAD PHOTOS */
async function loadPhotos(){

try{

const res = await databases.listDocuments(
DATABASE_ID,
COLLECTION_ID
);

const gallery = document.getElementById("gallery");
gallery.innerHTML="";

res.documents.forEach(item=>{

const div = document.createElement("div");
div.className="nft-card";

const isVideo = item.file_type === "video";

div.innerHTML = isVideo
? `<video src="${item.img}" muted></video>`
: `<img src="${item.img}"/>`;

div.onclick = ()=>{

document.getElementById("modal").style.display="flex";

const img = document.getElementById("modalImage");
const video = document.getElementById("modalVideo");

img.style.display="none";
video.style.display="none";

if(isVideo){
video.src=item.img;
video.style.display="block";
video.play();
}else{
img.src=item.img;
img.style.display="block";
}

};

gallery.appendChild(div);

});

}catch(err){
console.log(err);
alert("Appwrite fetch error");
}

}

function closeModal(){
document.getElementById("modal").style.display="none";
}

document.getElementById("modal").onclick = closeModal;

</script>

</body>
</html>
