<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MY GALLERY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:#0a001f; color:white; font-family:Arial,sans-serif; overflow-x:hidden; }

    header{ text-align:center; padding:60px 20px 20px; position:relative; }
    h1{ font-size:5rem; color:#ff00ff; text-shadow:0 0 25px #ff00ff; margin-bottom:15px; }

    .header-buttons{ position:absolute; top:20px; right:20px; display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }

    button{
      padding:12px 24px; background:transparent; border:2px solid #00ffff;
      color:#00ffff; border-radius:50px; cursor:pointer; font-weight:bold; transition:0.3s;
    }
    button:hover{ background:#00ffff; color:black; transform:scale(1.05); }

    .delete-mode-btn{ border-color:#ff3366; color:#ff3366; }
    .delete-mode-btn.active{ background:#ff3366; color:white; }

    .nav{ display:flex; justify-content:center; gap:20px; padding:20px; background:#140029; flex-wrap:wrap; }
    .nav-btn.active{ background:#ff00ff; border-color:#ff00ff; color:black; }

    .section{ display:none; }
    .section.active{ display:block; }

    .gallery{
      width:100%; padding:15px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    }
    .nft-card{
      background:#1d0037; border-radius:12px; overflow:hidden; border:1px solid #440066;
      position:relative; cursor:pointer;
    }
    .nft-card img{
      width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
    }
    .nft-card.selected::after{
      content: "✓";
      position:absolute; top:10px; right:10px;
      background:#00ff88; color:black; width:32px; height:32px;
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-weight:bold; border:3px solid white; font-size:18px;
    }

    @media(min-width:768px){ .gallery{ grid-template-columns:repeat(5,1fr); gap:15px; } }
    @media(min-width:1024px){ .gallery{ grid-template-columns:repeat(6,1fr); gap:18px; padding:25px; } }

    /* Password Screen */
    #passwordScreen {
      position: fixed; inset: 0; background: #0a001f;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; flex-direction: column; gap: 25px;
    }

    /* Stylish Upload Modal */
    .modal{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95);
      z-index:1000; justify-content:center; align-items:center; padding:20px;
    }

    .modal-content{
      background: linear-gradient(135deg, #1f003d, #2e0055);
      width:100%; max-width:500px; border-radius:30px;
      padding:45px 35px; position:relative; 
      border:4px solid #ff00ff;
      box-shadow:0 0 80px rgba(255, 0, 255, 0.8);
      text-align:center;
    }

    .modal-content h2{
      font-size:2rem;
      color:#ff00ff;
      margin-bottom:30px;
      text-shadow:0 0 15px #ff00ff;
    }

    .modal-content input[type="file"]{
      width:100%;
      padding:20px;
      background:#0f0022;
      border:3px dashed #00ffff;
      border-radius:20px;
      color:#00ffff;
      font-size:1.1rem;
      margin:20px 0;
      cursor:pointer;
    }

    .modal-content select{
      width:100%;
      padding:16px;
      background:#0f0022;
      border:2px solid #6600aa;
      border-radius:15px;
      color:white;
      font-size:1.1rem;
      margin:15px 0;
    }

    .modal-buttons{
      display:flex;
      gap:15px;
      justify-content:center;
      margin-top:35px;
    }

    .close{
      position:absolute; top:15px; right:25px; font-size:42px;
      cursor:pointer; color:#ff00ff;
    }
    .close:hover{ color:#ff66ff; transform:rotate(90deg); }

    /* Loader */
    .loader-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,0.96);
      display:none; justify-content:center; align-items:center;
      flex-direction:column; z-index:99999;
    }
    .loader{
      width:90px; height:90px; border:8px solid #222;
      border-top:8px solid #00ffff; border-radius:50%; 
      animation:spin 1s linear infinite;
    }
    @keyframes spin{ 100%{ transform:rotate(360deg); } }

    .loader-text{ margin-top:30px; color:#00ffff; font-size:1.8rem; font-weight:bold; }
    .progress-text{ margin-top:15px; color:#fff; font-size:1.5rem; font-weight:bold; }

    .delete-btn{
      margin-top:15px; width:100%; padding:14px; border:none;
      border-radius:10px; background:#ff0033; color:white; cursor:pointer;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <div id="passwordScreen">
    <h1>MY GALLERY</h1>
    <h2>Enter Password to Access</h2>
    <input type="password" id="passwordInput" placeholder="Enter Password" style="padding:15px; width:300px; font-size:1.2rem; border-radius:12px; border:none; background:#1a0033; color:white;"/>
    <button onclick="checkPassword()" style="padding:14px 40px; font-size:1.1rem;">ENTER GALLERY</button>
    <p id="passwordError" style="color:#ff3366; margin-top:10px; display:none;">❌ Wrong Password</p>
  </div>

  <!-- MAIN CONTENT -->
  <div id="mainContent" style="display:none;">

    <header>
      <h1>MY GALLERY</h1>
      <div class="header-buttons">
        <button id="uploadBtn">UPLOAD IMAGES</button>
        <button id="deleteModeBtn" class="delete-mode-btn">DELETE MODE</button>
      </div>
    </header>

    <nav class="nav">
      <button class="nav-btn active" id="xyzBtn">XYZ</button>
      <button class="nav-btn" id="xyzsBtn">XYZS</button>
    </nav>

    <section id="xyz-section" class="section active">
      <div class="gallery" id="xyz-gallery"></div>
    </section>

    <section id="xyzs-section" class="section">
      <div class="gallery" id="xyzs-gallery"></div>
    </section>

    <!-- Delete Bar -->
    <div id="deleteBar" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); 
         background:#ff0033; padding:15px 30px; border-radius:50px; color:white; font-weight:bold; box-shadow:0 0 25px rgba(255,0,51,0.7); z-index:10000;">
      <span id="selectedCount">0 Selected</span>
      <button onclick="deleteSelected()" style="margin-left:25px; background:white; color:#ff0033; border:none; padding:10px 24px; border-radius:30px; font-weight:bold;">DELETE SELECTED</button>
      <button onclick="exitDeleteMode()" style="margin-left:12px; background:transparent; border:2px solid white; color:white; padding:10px 20px; border-radius:30px;">Cancel</button>
    </div>
  </div>

  <!-- Stylish Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" id="closeUpload">&times;</span>
      <h2>✦ UPLOAD IMAGES ✦</h2>
      
      <input type="file" id="imageUpload" accept="image/*" multiple/>
      
      <select id="nftSection">
        <option value="xyz">XYZ Section</option>
        <option value="xyzs">XYZS Section</option>
      </select>
      
      <div class="modal-buttons">
        <button onclick="uploadNFTs()" style="background:#00ff88; color:black; border:none; padding:16px 40px; font-size:1.1rem;">UPLOAD NOW</button>
        <button onclick="closeUploadModal()" style="background:transparent; border:2px solid #ff00ff; padding:16px 35px;">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" id="closePreview">&times;</span>
      <img id="modalImage" src="" alt="Photo">
    </div>
  </div>

  <!-- Loader -->
  <div class="loader-overlay" id="loader">
    <div class="loader"></div>
    <div class="loader-text" id="loaderText">Uploading Images...</div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>

  <script>
    const SUPABASE_URL = "https://mqhckgezaxswrroqwnvt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xaGNrZ2V6YXhzd3Jyb3F3bnZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjgzNzUsImV4cCI6MjA5NDcwNDM3NX0.6vtCwg6Wu0r4RSD6yAfCh4wP7aovhoEiBYpCRYMIe6s";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let xyzData = [], xyzsData = [];
    let deleteMode = false;
    let selectedIds = new Set();
    const CORRECT_PASSWORD = "Krrish@123";

    function checkPassword() {
      if(document.getElementById("passwordInput").value === CORRECT_PASSWORD) {
        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        loadNFTs();
      } else {
        document.getElementById("passwordError").style.display = "block";
        setTimeout(() => document.getElementById("passwordError").style.display = "none", 2500);
      }
    }

    async function loadNFTs(){
      const { data } = await supabaseClient.from("photos_data").select("*").order("id", { ascending: false });
      xyzData = data.filter(item => item.section === "xyz");
      xyzsData = data.filter(item => item.section === "xyzs");

      renderGallery("xyz-gallery", xyzData);
      renderGallery("xyzs-gallery", xyzsData);
    }

    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = data.length === 0 ? "<h2 style='text-align:center;width:100%;padding:60px;color:#777;'>No Photos Yet</h2>" : "";

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        card.dataset.id = item.id;
        card.innerHTML = `<img src="${item.img}" alt="Photo">`;

        card.onclick = () => {
          if(deleteMode) toggleSelect(card, item.id);
          else {
            document.getElementById("modalImage").src = item.img;
            document.getElementById("previewModal").style.display = "flex";
          }
        };
        container.appendChild(card);
      });
    }

    function toggleSelect(card, id){
      if(selectedIds.has(id)){
        selectedIds.delete(id);
        card.classList.remove("selected");
      } else {
        selectedIds.add(id);
        card.classList.add("selected");
      }
      updateDeleteBar();
    }

    function updateDeleteBar(){
      const count = selectedIds.size;
      document.getElementById("selectedCount").innerText = `${count} Selected`;
      document.getElementById("deleteBar").style.display = count > 0 ? "flex" : "none";
    }

    async function deleteSelected(){
      if(!confirm(`Delete ${selectedIds.size} photos?`)) return;
      // ... (delete logic same)
      for(let id of selectedIds){
        try{
          const { data: photo } = await supabaseClient.from("photos_data").select("img").eq("id", id).single();
          if(photo?.img){
            const path = photo.img.split("/photos/")[1];
            if(path) await supabaseClient.storage.from("photos").remove([path]);
          }
          await supabaseClient.from("photos_data").delete().eq("id", id);
        } catch(e){}
      }
      alert("Deleted Successfully");
      exitDeleteMode();
      loadNFTs();
    }

    function exitDeleteMode(){
      deleteMode = false;
      selectedIds.clear();
      document.getElementById("deleteModeBtn").classList.remove("active");
      document.getElementById("deleteBar").style.display = "none";
      loadNFTs();
    }

    // Upload Function with Fixed Progress
    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0) return alert("Please select images");

      const loader = document.getElementById("loader");
      const loaderText = document.getElementById("loaderText");
      const progressText = document.getElementById("progressText");

      loader.style.display = "flex";
      loaderText.innerText = "Uploading Images...";
      progressText.innerText = `0 / ${files.length}`;

      const section = document.getElementById("nftSection").value;
      let uploadedCount = 0;

      for(let i = 0; i < files.length; i++){
        try{
          const file = files[i];
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
          const path = `${section}/${fileName}`;

          await supabaseClient.storage.from("photos").upload(path, file, { upsert: true });
          const { data: urlData } = supabaseClient.storage.from("photos").getPublicUrl(path);

          await supabaseClient.from("photos_data").insert([{
            title: "Untitled",
            description: "",
            img: urlData.publicUrl,
            section: section
          }]);

          uploadedCount++;
          progressText.innerText = `${uploadedCount} / ${files.length}`;
        } catch(err){
          console.log(err);
        }
      }

      loaderText.innerText = "✅ Upload Complete!";
      progressText.innerText = `${uploadedCount} Image(s) Uploaded Successfully`;

      setTimeout(() => {
        loader.style.display = "none";
        closeUploadModal();
        loadNFTs();
      }, 1800);
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
    }

    // Event Listeners
    document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadModal").style.display = "flex");
    document.getElementById("deleteModeBtn").addEventListener("click", () => {
      deleteMode = !deleteMode;
      document.getElementById("deleteModeBtn").classList.toggle("active", deleteMode);
      if(!deleteMode) exitDeleteMode();
    });

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = closeUploadModal;

    window.onclick = (e) => {
      if(e.target.id === "previewModal") document.getElementById("previewModal").style.display = "none";
      if(e.target.id === "uploadModal") closeUploadModal();
    };

    // Navigation + Password Enter Key
    document.getElementById("passwordInput").addEventListener("keypress", e => { if(e.key === "Enter") checkPassword(); });
    // ... (navigation buttons same as previous)

    document.getElementById("xyzBtn").addEventListener("click", () => {
      document.getElementById("xyz-section").classList.add("active");
      document.getElementById("xyzs-section").classList.remove("active");
      document.getElementById("xyzBtn").classList.add("active");
      document.getElementById("xyzsBtn").classList.remove("active");
      if(deleteMode) exitDeleteMode();
    });

    document.getElementById("xyzsBtn").addEventListener("click", () => {
      document.getElementById("xyzs-section").classList.add("active");
      document.getElementById("xyz-section").classList.remove("active");
      document.getElementById("xyzsBtn").classList.add("active");
      document.getElementById("xyzBtn").classList.remove("active");
      if(deleteMode) exitDeleteMode();
    });
  </script>
</body>
</html>
