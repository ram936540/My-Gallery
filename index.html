<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Private Gallery</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#0f172a;
      color:white;
      padding:20px;
    }

    h1{
      margin-bottom:20px;
      text-align:center;
      font-size:32px;
    }

    .topbar{
      display:flex;
      gap:10px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    input{
      padding:12px;
      border:none;
      border-radius:10px;
      outline:none;
      width:220px;
      font-size:16px;
    }

    button{
      padding:12px 16px;
      border:none;
      border-radius:10px;
      background:#3b82f6;
      color:white;
      cursor:pointer;
      font-weight:bold;
      transition:0.2s;
    }

    button:hover{
      background:#2563eb;
      transform:scale(1.03);
    }

    .albums{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .album{
      padding:10px 18px;
      background:#1e293b;
      border-radius:12px;
      cursor:pointer;
      border:2px solid transparent;
      transition:0.2s;
    }

    .album:hover{
      background:#334155;
    }

    .album.active{
      border-color:#3b82f6;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:15px;
    }

    .card{
      background:#1e293b;
      border-radius:15px;
      overflow:hidden;
      padding:10px;
      animation:fadeIn 0.3s ease;
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:10px;
    }

    .actions{
      margin-top:10px;
      display:flex;
      gap:8px;
    }

    .actions a,
    .actions button{
      flex:1;
      text-align:center;
      text-decoration:none;
      font-size:14px;
    }

    .uploadBox{
      margin-bottom:20px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .empty{
      text-align:center;
      margin-top:50px;
      opacity:0.7;
      font-size:20px;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:600px){

      input{
        width:100%;
      }

      .topbar,
      .uploadBox{
        flex-direction:column;
      }

      button{
        width:100%;
      }
    }
  </style>
</head>
<body>

<h1>📸 My Private Gallery</h1>

<div class="topbar">
  <input type="text" id="albumName" placeholder="New Album Name">
  <button onclick="createAlbum()">➕ Add Album</button>
</div>

<div class="albums" id="albums"></div>

<div class="uploadBox">
  <input type="file" id="fileInput" multiple accept="image/*">
  <button onclick="uploadPhotos()">⬆ Upload Photos</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="empty" id="empty">
  No Photos Yet
</div>

<script>

  // =========================
  // SUPABASE CONFIG
  // =========================

  const SUPABASE_URL =
    "https://mqhckgezaxswrroqwnvt.supabase.co";

  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xaGNrZ2V6YXhzd3Jyb3F3bnZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjgzNzUsImV4cCI6MjA5NDcwNDM3NX0.6vtCwg6Wu0r4RSD6yAfCh4wP7aovhoEiBYpCRYMIe6s";

  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  // =========================

  let albums =
    JSON.parse(localStorage.getItem("albums"))
    || ["Default"];

  let currentAlbum = albums[0];

  renderAlbums();

  // =========================
  // CREATE ALBUM
  // =========================

  function createAlbum(){

    const input =
      document.getElementById("albumName");

    const name =
      input.value.trim();

    if(!name){
      alert("Enter album name");
      return;
    }

    if(albums.includes(name)){
      alert("Album already exists");
      return;
    }

    albums.push(name);

    localStorage.setItem(
      "albums",
      JSON.stringify(albums)
    );

    currentAlbum = name;

    input.value = "";

    renderAlbums();

    loadPhotos();
  }

  // =========================
  // SHOW ALBUMS
  // =========================

  function renderAlbums(){

    const albumsDiv =
      document.getElementById("albums");

    albumsDiv.innerHTML = "";

    albums.forEach(album=>{

      const div =
        document.createElement("div");

      div.className =
        currentAlbum === album
        ? "album active"
        : "album";

      div.innerText = album;

      div.onclick = ()=>{

        currentAlbum = album;

        renderAlbums();

        loadPhotos();
      }

      albumsDiv.appendChild(div);
    });
  }

  // =========================
  // UPLOAD PHOTOS
  // =========================

  async function uploadPhotos(){

    const files =
      document.getElementById("fileInput").files;

    if(!files.length){
      alert("Select photos first");
      return;
    }

    for(const file of files){

      const fileName =
        `${currentAlbum}/${Date.now()}-${file.name}`;

      const { error } =
        await supabase
        .storage
        .from("photos")
        .upload(fileName, file);

      if(error){
        console.log(error);
        alert("Upload failed");
        return;
      }
    }

    alert("Upload complete");

    document.getElementById("fileInput").value = "";

    loadPhotos();
  }

  // =========================
  // LOAD PHOTOS
  // =========================

  async function loadPhotos(){

    const gallery =
      document.getElementById("gallery");

    gallery.innerHTML = "";

    const empty =
      document.getElementById("empty");

    const { data, error } =
      await supabase
      .storage
      .from("photos")
      .list(currentAlbum, {
        limit:100
      });

    if(error){
      console.log(error);
      return;
    }

    if(!data.length){
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";

    data.forEach(photo=>{

      const imageUrl =
        `${SUPABASE_URL}/storage/v1/object/public/photos/${currentAlbum}/${photo.name}`;

      const card =
        document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <img src="${imageUrl}" />

        <div class="actions">

          <a href="${imageUrl}" download target="_blank">
            <button>⬇ Download</button>
          </a>

          <button onclick="deletePhoto('${photo.name}')">
            🗑 Delete
          </button>

        </div>
      `;

      gallery.appendChild(card);
    });
  }

  // =========================
  // DELETE PHOTO
  // =========================

  async function deletePhoto(photoName){

    const ok =
      confirm("Delete this photo?");

    if(!ok) return;

    const { error } =
      await supabase
      .storage
      .from("photos")
      .remove([
        `${currentAlbum}/${photoName}`
      ]);

    if(error){
      alert("Delete failed");
      return;
    }

    loadPhotos();
  }

  loadPhotos();

</script>

</body>
</html>
