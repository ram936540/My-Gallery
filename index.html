<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MY GALLERY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:#0a001f; color:white; font-family:Arial,sans-serif; overflow-x:hidden; }

    header{ text-align:center; padding:60px 20px 20px; position:relative; }
    h1{ font-size:5rem; color:#ff00ff; text-shadow:0 0 25px #ff00ff; margin-bottom:15px; }

    .header-buttons{ position:absolute; top:20px; right:20px; display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; }

    button{
      padding:12px 24px; background:transparent; border:2px solid #00ffff;
      color:#00ffff; border-radius:50px; cursor:pointer; font-weight:bold; transition:0.3s;
      font-size: 1.4rem;   /* Emoji ke liye thoda bada kiya */
    }
    button:hover{ background:#00ffff; color:black; transform:scale(1.05); }

    .delete-mode-btn{ border-color:#ff3366; color:#ff3366; }
    .delete-mode-btn.active{ background:#ff3366; color:white; }

    .nav{ display:flex; justify-content:center; gap:10px; padding:20px; background:#140029; flex-wrap:wrap; overflow-x:auto; }
    .nav-btn.active{ background:#ff00ff; border-color:#ff00ff; color:black; }

    .gallery{
      width:100%; padding:15px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    }
    .nft-card{
      background:#1d0037; border-radius:12px; overflow:hidden; border:1px solid #440066;
      position:relative; cursor:pointer;
    }
    .nft-card img{
      width:100%; aspect-ratio:1/1; object-fit:cover;
    }
    .nft-card.selected::after{
      content: "✓"; position:absolute; top:10px; right:10px;
      background:#00ff88; color:black; width:32px; height:32px;
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-weight:bold; border:3px solid white;
    }

    .modal{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95);
      z-index:1000; justify-content:center; align-items:center; padding:20px;
    }

    .modal-content{
      background: linear-gradient(135deg, #2a004d, #4b0082);
      width:100%; max-width:520px; border-radius:32px;
      padding:50px 40px; position:relative; 
      border:5px solid #ff00ff;
      box-shadow:0 0 90px rgba(255, 0, 255, 0.9);
      text-align:center;
    }

    .close{
      position:absolute; top:15px; right:25px; font-size:42px;
      cursor:pointer; color:#ff00ff;
    }

    /* Tom & Jerry Style Loader */
    .loader-overlay{
      position:fixed; inset:0; background:rgba(10,0,31,0.98);
      display:none; justify-content:center; align-items:center;
      flex-direction:column; z-index:99999;
    }
    .loader{
      width:180px; height:180px; 
      animation: bounce 1.4s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-45px); }
    }

    .loader-text{ 
      margin-top:25px; 
      color:#00ffff; 
      font-size:2.2rem; 
      font-weight:bold; 
      text-shadow:0 0 25px #ff00ff;
    }

    .progress-text{ margin-top:10px; color:#fff; font-size:1.6rem; font-weight:bold; }
  </style>
</head>
<body>

  <!-- PASSWORD SCREEN -->
  <div id="passwordScreen">
    <h1>MY GALLERY</h1>
    <h2>Enter Password to Access</h2>
    <input type="password" id="passwordInput" placeholder="Enter Password" style="padding:15px; width:300px; font-size:1.2rem; border-radius:12px; border:none; background:#1a0033; color:white;"/>
    <button onclick="checkPassword()" style="padding:14px 40px; font-size:1.1rem;">ENTER GALLERY</button>
    <p id="passwordError" style="color:#ff3366; margin-top:10px; display:none;">❌ Wrong Password</p>
  </div>

  <!-- MAIN CONTENT -->
  <div id="mainContent" style="display:none;">
    <header>
      <h1>MY GALLERY</h1>
      <div class="header-buttons">
        <button id="uploadBtn" title="Upload Images">📤</button>
        <button id="deleteModeBtn" class="delete-mode-btn" title="Delete Mode">🗑️</button>
        <button id="editSectionsBtn" title="Edit Sections">✏️</button>
      </div>
    </header>

    <nav class="nav" id="sectionsNav"></nav>

    <section id="currentSection" class="section active">
      <div class="gallery" id="currentGallery"></div>
    </section>

    <!-- Delete Bar -->
    <div id="deleteBar" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#ff0033; padding:15px 30px; border-radius:50px; color:white; font-weight:bold; box-shadow:0 0 25px rgba(255,0,51,0.7); z-index:10000;">
      <span id="selectedCount">0 Selected</span>
      <button onclick="deleteSelected()" style="margin-left:25px; background:white; color:#ff0033; border:none; padding:10px 24px; border-radius:30px;">DELETE SELECTED</button>
      <button onclick="exitDeleteMode()" style="margin-left:12px; background:transparent; border:2px solid white; color:white; padding:10px 20px; border-radius:30px;">Cancel</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('uploadModal')">×</span>
      <h2>✦ UPLOAD IMAGES ✦</h2>
      <input type="file" id="imageUpload" accept="image/*" multiple/>
      <select id="uploadSectionSelect" style="width:100%; padding:16px; margin:25px 0;"></select>
      
      <div style="margin-top:30px;">
        <button onclick="uploadImages()" style="background:#00ff88; color:black; border:none; padding:16px 50px; font-size:1.2rem;">🚀 UPLOAD NOW</button>
        <button onclick="closeModal('uploadModal')" style="background:transparent; border:2px solid #ff00ff; padding:16px 40px; margin-left:15px;">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- Edit Sections Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2>Edit Section Names</h2>
      <div id="sectionsList" style="max-height:400px; overflow-y:auto; text-align:left; padding:10px;"></div>
      <br>
      <button onclick="saveSectionNames()" style="background:#00ff88; color:black; padding:12px 30px;">SAVE CHANGES</button>
      <button onclick="closeModal('editModal')" style="margin-left:10px;">CLOSE</button>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('previewModal')">×</span>
      <img id="modalImage" src="" alt="Photo" style="max-width:100%; border-radius:15px;">
    </div>
  </div>

  <!-- Tom & Jerry Style Loader -->
  <div class="loader-overlay" id="loader">
    <div class="loader">
      <img src="https://i.imgur.com/8vJ8z3K.gif" width="180" alt="Tom and Jerry">
    </div>
    <div class="loader-text" id="loaderText">Uploading... 🐱🐭</div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>

  <script>
    const SUPABASE_URL = "https://mqhckgezaxswrroqwnvt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xaGNrZ2V6YXhzd3Jyb3F3bnZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjgzNzUsImV4cCI6MjA5NDcwNDM3NX0.6vtCwg6Wu0r4RSD6yAfCh4wP7aovhoEiBYpCRYMIe6s";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let sections = [];
    let currentSectionKey = "sec1";
    let deleteMode = false;
    let selectedIds = new Set();
    const CORRECT_PASSWORD = "Krrish@123";

    async function loadSections() {
      const { data } = await supabaseClient.from("gallery_sections").select("*").order("position");
      sections = data || [];
      renderNavigation();
      loadPhotos(currentSectionKey);
    }

    function renderNavigation() {
      const nav = document.getElementById("sectionsNav");
      nav.innerHTML = "";
      sections.forEach(sec => {
        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.textContent = sec.section_name;
        if (sec.section_key === currentSectionKey) btn.classList.add("active");
        btn.onclick = () => {
          currentSectionKey = sec.section_key;
          renderNavigation();
          loadPhotos(currentSectionKey);
        };
        nav.appendChild(btn);
      });
    }

    async function loadPhotos(sectionKey) {
      const { data } = await supabaseClient.from("photos_data").select("*").eq("section", sectionKey).order("id", { ascending: false });
      const gallery = document.getElementById("currentGallery");
      gallery.innerHTML = "";

      if (!data || data.length === 0) {
        gallery.innerHTML = `<h2 style="text-align:center;padding:60px;color:#777;">No Photos Yet</h2>`;
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        card.dataset.id = item.id;
        card.innerHTML = `<img src="${item.img}" alt="Photo">`;

        card.onclick = () => {
          if (deleteMode) toggleSelect(card, item.id);
          else {
            document.getElementById("modalImage").src = item.img;
            document.getElementById("previewModal").style.display = "flex";
          }
        };
        gallery.appendChild(card);
      });
    }

    function toggleSelect(card, id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
        card.classList.remove("selected");
      } else {
        selectedIds.add(id);
        card.classList.add("selected");
      }
      updateDeleteBar();
    }

    function updateDeleteBar() {
      const count = selectedIds.size;
      document.getElementById("selectedCount").innerText = `${count} Selected`;
      document.getElementById("deleteBar").style.display = count > 0 ? "flex" : "none";
    }

    async function deleteSelected() {
      if (!confirm(`Delete ${selectedIds.size} photos permanently?`)) return;
      for (let id of selectedIds) {
        try {
          const { data: photo } = await supabaseClient.from("photos_data").select("img").eq("id", id).single();
          if (photo?.img) {
            const path = photo.img.split("/photos/")[1];
            if (path) await supabaseClient.storage.from("photos").remove([path]);
          }
          await supabaseClient.from("photos_data").delete().eq("id", id);
        } catch (e) {}
      }
      alert("Deleted Successfully");
      exitDeleteMode();
      loadPhotos(currentSectionKey);
    }

    function exitDeleteMode() {
      deleteMode = false;
      selectedIds.clear();
      document.getElementById("deleteModeBtn").classList.remove("active");
      document.getElementById("deleteBar").style.display = "none";
      loadPhotos(currentSectionKey);
    }

    async function uploadImages() {
      const files = document.getElementById("imageUpload").files;
      if (files.length === 0) return alert("Please select images");

      const loader = document.getElementById("loader");
      loader.style.display = "flex";
      document.getElementById("progressText").innerText = `0 / ${files.length}`;

      const sectionKey = document.getElementById("uploadSectionSelect").value;
      let count = 0;

      for (let file of files) {
        try {
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
          const path = `${sectionKey}/${fileName}`;

          await supabaseClient.storage.from("photos").upload(path, file, { upsert: true });
          const { data: urlData } = supabaseClient.storage.from("photos").getPublicUrl(path);

          await supabaseClient.from("photos_data").insert([{
            title: "Untitled",
            description: "",
            img: urlData.publicUrl,
            section: sectionKey
          }]);

          count++;
          document.getElementById("progressText").innerText = `${count} / ${files.length}`;
        } catch (err) { console.log(err); }
      }

      document.getElementById("loaderText").innerText = "✅ Upload Complete! 🎉";
      setTimeout(() => {
        loader.style.display = "none";
        closeModal('uploadModal');
        loadPhotos(currentSectionKey);
      }, 2000);
    }

    function showEditModal() {
      const list = document.getElementById("sectionsList");
      list.innerHTML = "";
      sections.forEach(sec => {
        const div = document.createElement("div");
        div.style.margin = "12px 0";
        div.innerHTML = `<strong>${sec.section_key}:</strong> <input type="text" value="${sec.section_name}" data-key="${sec.section_key}" style="width:70%; padding:8px; border-radius:6px;">`;
        list.appendChild(div);
      });
      document.getElementById("editModal").style.display = "flex";
    }

    async function saveSectionNames() {
      const inputs = document.querySelectorAll("#sectionsList input");
      for (let input of inputs) {
        const key = input.dataset.key;
        const name = input.value.trim();
        if (name) {
          await supabaseClient.from("gallery_sections").update({ section_name: name }).eq("section_key", key);
        }
      }
      alert("Section names updated successfully!");
      closeModal("editModal");
      loadSections();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function checkPassword() {
      if (document.getElementById("passwordInput").value === CORRECT_PASSWORD) {
        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        loadSections();
      } else {
        document.getElementById("passwordError").style.display = "block";
        setTimeout(() => document.getElementById("passwordError").style.display = "none", 2500);
      }
    }

    // Event Listeners
    document.getElementById("uploadBtn").addEventListener("click", () => {
      const select = document.getElementById("uploadSectionSelect");
      select.innerHTML = "";
      sections.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.section_key;
        opt.textContent = s.section_name;
        select.appendChild(opt);
      });
      document.getElementById("uploadModal").style.display = "flex";
    });

    document.getElementById("deleteModeBtn").addEventListener("click", () => {
      deleteMode = !deleteMode;
      document.getElementById("deleteModeBtn").classList.toggle("active", deleteMode);
      if (!deleteMode) exitDeleteMode();
    });

    document.getElementById("editSectionsBtn").addEventListener("click", showEditModal);

    document.getElementById("passwordInput").addEventListener("keypress", e => {
      if (e.key === "Enter") checkPassword();
    });
  </script>
</body>
</html>
