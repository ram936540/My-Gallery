<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MY GALLERY</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ background:#0a001f; color:white; font-family:Arial,sans-serif; overflow-x:hidden; }

    header{ text-align:center; padding:60px 20px 20px; position:relative; }
    h1{ font-size:5rem; color:#ff00ff; text-shadow:0 0 25px #ff00ff; margin-bottom:15px; }

    .header-buttons{ position:absolute; top:20px; right:20px; display:flex; gap:12px; }

    button{
      padding:12px 28px; background:transparent; border:2px solid #00ffff;
      color:#00ffff; border-radius:50px; cursor:pointer; font-weight:bold; transition:0.3s;
    }
    button:hover{ background:#00ffff; color:black; transform:scale(1.05); }

    .nav{ display:flex; justify-content:center; gap:20px; padding:20px; background:#140029; flex-wrap:wrap; }
    .nav-btn.active{ background:#ff00ff; border-color:#ff00ff; color:black; }

    .section{ display:none; }
    .section.active{ display:block; }

    .gallery{
      width:100%; padding:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    }
    .nft-card{
      background:#1d0037; border-radius:12px; overflow:hidden; border:1px solid #440066;
    }
    .nft-card img{
      width:100%; aspect-ratio:1/1; object-fit:cover; display:block; cursor:pointer;
    }

    @media(min-width:768px){ .gallery{ grid-template-columns:repeat(5,1fr); gap:12px; } }
    @media(min-width:1024px){ .gallery{ grid-template-columns:repeat(6,1fr); gap:15px; padding:20px; } }

    .modal{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95);
      z-index:1000; justify-content:center; align-items:center; padding:20px;
    }

    .modal-content{
      background:#1a0033; width:100%; max-width:520px; border-radius:28px;
      padding:35px 30px; position:relative; border:3px solid #ff00ff;
      box-shadow:0 0 50px rgba(255, 0, 255, 0.6);
    }

    .close{
      position:absolute; top:15px; right:25px; font-size:42px;
      cursor:pointer; color:#ff00ff;
    }
    .close:hover{ color:#ff66ff; transform:rotate(90deg); }

    .modal-content img{
      width:100%; max-height:460px; object-fit:contain; border-radius:16px;
      background:#0a001f; border:2px solid #440066;
    }

    .delete-btn{
      margin-top:15px; width:100%; padding:12px; border:none;
      border-radius:10px; background:#ff0033; color:white; cursor:pointer;
    }

    .loader-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,0.94);
      display:none; justify-content:center; align-items:center;
      flex-direction:column; z-index:99999;
    }
    .loader{
      width:80px; height:80px; border:7px solid #333;
      border-top:7px solid #00ffff; border-radius:50%; animation:spin 1s linear infinite;
    }
    @keyframes spin{ 100%{ transform:rotate(360deg); } }

    .loader-text{ margin-top:25px; color:#00ffff; font-size:1.5rem; font-weight:bold; }
    .progress-text{ margin-top:12px; color:#fff; font-size:1.3rem; }
  </style>
</head>
<body>

  <header>
    <h1>MY GALLERY</h1>
    <div class="header-buttons">
      <button id="loginBtn">LOGIN</button>
      <button id="uploadBtn" style="display:none;">UPLOAD NFT</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" id="xyzBtn">XYZ</button>
    <button class="nav-btn" id="xyzsBtn">XYZS</button>
  </nav>

  <section id="xyz-section" class="section active">
    <div class="gallery" id="xyz-gallery"></div>
  </section>

  <section id="xyzs-section" class="section">
    <div class="gallery" id="xyzs-gallery"></div>
  </section>

  <!-- UPLOAD MODAL -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close" id="closeUpload">&times;</span>
      <h2>✦ UPLOAD NEW NFT ✦</h2>
      
      <input type="file" id="imageUpload" accept="image/*" multiple/>
      
      <select id="nftSection">
        <option value="xyz">XYZ</option>
        <option value="xyzs">XYZS</option>
      </select>
      
      <div style="margin-top:30px; text-align:center;">
        <button onclick="uploadNFTs()">UPLOAD NOW</button>
        <button onclick="closeUploadModal()">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- PREVIEW MODAL -->
  <div class="modal" id="previewModal">
    <div class="modal-content">
      <span class="close" id="closePreview">&times;</span>
      <img id="modalImage" src="" alt="NFT Image">
    </div>
  </div>

  <!-- LOADER -->
  <div class="loader-overlay" id="loader">
    <div class="loader"></div>
    <div class="loader-text" id="loaderText">Uploading NFTs...</div>
    <div class="progress-text" id="progressText">0/0</div>
  </div>

  <script>
    const SUPABASE_URL = "https://mqhckgezaxswrroqwnvt.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xaGNrZ2V6YXhzd3Jyb3F3bnZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjgzNzUsImV4cCI6MjA5NDcwNDM3NX0.6vtCwg6Wu0r4RSD6yAfCh4wP7aovhoEiBYpCRYMIe6s";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let xyzData = [];
    let xyzsData = [];
    let isLoggedIn = false;

    async function loadNFTs(){
      const { data } = await supabaseClient.from("nfts_data").select("*").order("id", { ascending: false });

      xyzData = [];
      xyzsData = [];

      data.forEach(item => {
        const nft = { id: item.id, img: item.img, section: item.section };
        if (item.section === "xyz") xyzData.push(nft);
        else if (item.section === "xyzs") xyzsData.push(nft);
      });

      renderGallery("xyz-gallery", xyzData);
      renderGallery("xyzs-gallery", xyzsData);
    }

    function renderGallery(containerId, data){
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if(data.length === 0){
        container.innerHTML = "<h2 style='text-align:center;width:100%;padding:40px;'>No NFTs Yet</h2>";
        return;
      }

      data.forEach(item => {
        const card = document.createElement("div");
        card.className = "nft-card";
        card.innerHTML = `<img src="${item.img}" alt="NFT">`;

        if(isLoggedIn){
          const delBtn = document.createElement("button");
          delBtn.className = "delete-btn";
          delBtn.innerText = "DELETE";
          delBtn.onclick = () => deleteNFT(item.id);
          card.appendChild(delBtn);
        }

        card.querySelector("img").onclick = () => {
          document.getElementById("modalImage").src = item.img;
          document.getElementById("previewModal").style.display = "flex";
        };
        container.appendChild(card);
      });
    }

    async function deleteNFT(id){
      if(!confirm("Delete this NFT permanently from everywhere?")) return;

      try {
        const { data: nft } = await supabaseClient
          .from("nfts_data")
          .select("img")
          .eq("id", id)
          .single();

        if(nft && nft.img){
          const imagePath = nft.img.split("/nfts/")[1];
          if(imagePath){
            await supabaseClient.storage.from("nfts").remove([imagePath]);
          }
        }

        await supabaseClient.from("nfts_data").delete().eq("id", id);

        alert("NFT Deleted Successfully");
        await loadNFTs();
      } catch(err){
        console.error(err);
        alert("Delete Failed");
      }
    }

    async function uploadNFTs(){
      const files = document.getElementById("imageUpload").files;
      if(files.length === 0) return alert("Please select images");

      document.getElementById("loader").style.display = "flex";
      document.getElementById("loaderText").innerText = "Uploading...";
      document.getElementById("progressText").innerText = `0/${files.length}`;

      const section = document.getElementById("nftSection").value;

      let uploadedCount = 0;

      for(let i = 0; i < files.length; i++){
        const file = files[i];
        try{
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${file.name.split('.').pop()}`;
          const path = `${section}/${fileName}`;

          await supabaseClient.storage.from("nfts").upload(path, file, { upsert: true });
          const { data: urlData } = supabaseClient.storage.from("nfts").getPublicUrl(path);

          await supabaseClient.from("nfts_data").insert([{
            title: "Untitled",
            description: "",
            img: urlData.publicUrl,
            section: section
          }]);

          uploadedCount++;
          document.getElementById("progressText").innerText = `${uploadedCount}/${files.length}`;
        } catch(err){
          console.log(err);
        }
      }

      document.getElementById("loaderText").innerText = "✅ Upload Complete!";
      document.getElementById("progressText").innerText = `${uploadedCount} NFT(s) Uploaded Successfully`;

      await loadNFTs();

      setTimeout(() => {
        document.getElementById("loader").style.display = "none";
        closeUploadModal();
      }, 1800);
    }

    function closeUploadModal(){
      document.getElementById("uploadModal").style.display = "none";
    }

    // Login
    document.getElementById("loginBtn").addEventListener("click", () => {
      if(isLoggedIn){
        isLoggedIn = false;
        document.getElementById("loginBtn").innerText = "LOGIN";
        document.getElementById("uploadBtn").style.display = "none";
        loadNFTs();
        alert("Logged Out");
        return;
      }
      const secret = prompt("Enter Secret Word");
      if(secret === "tmkc" || secret === "Tmkc"){
        isLoggedIn = true;
        document.getElementById("loginBtn").innerText = "LOGOUT";
        document.getElementById("uploadBtn").style.display = "block";
        loadNFTs();
        alert("Login Successful");
      } else alert("Wrong Secret Word");
    });

    document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadModal").style.display = "flex");

    document.getElementById("closePreview").onclick = () => document.getElementById("previewModal").style.display = "none";
    document.getElementById("closeUpload").onclick = closeUploadModal;

    window.onclick = (e) => {
      if(e.target.id === "previewModal") document.getElementById("previewModal").style.display = "none";
      if(e.target.id === "uploadModal") closeUploadModal();
    };

    // Navigation
    document.getElementById("xyzBtn").addEventListener("click", () => {
      document.getElementById("xyz-section").classList.add("active");
      document.getElementById("xyzs-section").classList.remove("active");
      document.getElementById("xyzBtn").classList.add("active");
      document.getElementById("xyzsBtn").classList.remove("active");
    });

    document.getElementById("xyzsBtn").addEventListener("click", () => {
      document.getElementById("xyzs-section").classList.add("active");
      document.getElementById("xyz-section").classList.remove("active");
      document.getElementById("xyzsBtn").classList.add("active");
      document.getElementById("xyzBtn").classList.remove("active");
    });

    loadNFTs();
  </script>
</body>
</html>
